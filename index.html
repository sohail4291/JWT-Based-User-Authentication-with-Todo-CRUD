<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div id="container">
        <div id="inputdata">
            <input type="text" id="input" placeholder="enter something..">
            <button id="addtodo" onclick="addtodo()">Add Todo</button>
            
        </div>

        <div id="list">  </div>
    </div>

    <script>
        async function addtodo(){
            const res = await axios.post("http://localhost:3000/add", {
                body : document.getElementById("input").value
            },
            { headers: { token: localStorage.getItem("token") } 
            })
            const div = document.createElement("div"); // create a new div element
                div.setAttribute("id","todo");
                div.textContent = document.getElementById("input").value;
                document.getElementById("list").appendChild(div);

        }

        async function gettodo(){
            const res = await axios.get("http://localhost:3000/get",{ headers: { token: localStorage.getItem("token") } 
            });
            console.log("res :",res);
            const data = res.data; // response data from the server as an array 
            console.log("data : ",data);
            for(let i=0;i<data.length;i++){
                const div = document.createElement("div");
                div.setAttribute("id","todo");
                div.textContent = data[i]; 
                document.getElementById("list").appendChild(div);
            }   
        }
        gettodo(); 
       
        
    </script>
</body>
</html>
